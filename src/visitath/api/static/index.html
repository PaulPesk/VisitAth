<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisitAth</title>
  <style>
    :root { --bg:#fafafa; --fg:#1a1a1a; --card:#fff; --muted:#666; --line:#ddd; --accent:#1a5fb4; --good:#1b7a3d; --bad:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181b; --fg:#eee; --card:#202429; --muted:#9aa0a6; --line:#33383e; --accent:#6ea8fe; --good:#5fd38d; --bad:#ff8a80; }
    }
    body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); margin:0; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin: 0 0 4px; }
    .sub { color:var(--muted); margin:0 0 20px; }
    form { display:flex; gap:8px; }
    input { flex:1; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
    button { padding:10px 18px; font-size:16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #status { margin:16px 0; color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
    .card h2 { font-size:18px; margin:0 0 2px; }
    .meta { color:var(--muted); font-size:14px; }
    .price { font-weight:600; margin:8px 0; }
    .claim { margin:6px 0; padding-left:10px; border-left:3px solid var(--line); }
    .claim.positive { border-color:var(--good); }
    .claim.negative { border-color:var(--bad); }
    .note { color:var(--muted); font-style:italic; }
    footer { margin-top:32px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>VisitAth</h1>
  <p class="sub">Value-for-money Airbnb stays in Athens. Describe what you want, in English or Greek.</p>

  <form id="form">
    <input id="q" maxlength="300" required minlength="3"
           placeholder="e.g. quiet apartment for 2 in Koukaki under 120">
    <button id="go" type="submit">Search</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>

  <footer>
    Short-term rentals, Inside Airbnb snapshot of 22 Sep 2026. Prices are indicative.
    The "fair price" is a model estimate, not a guarantee of a deal.
  </footer>
</main>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const button = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;   // textContent: never HTML
    if (className) node.className = className;
    return node;
  }

  function renderCard(r) {
    const card = el("div", undefined, "card");
    card.appendChild(el("h2", r.name));
    card.appendChild(el("div", r.neighbourhood, "meta"));
    card.appendChild(el("div", "$" + r.price_per_night.toFixed(0) + " per night, " + r.price_verdict, "price"));

    r.claims.forEach(c => {
      const box = el("div", undefined, "claim " + (c.stance || ""));
      box.appendChild(el("span", "\u201C" + c.quote + "\u201D"));
      if (c.stance) box.appendChild(el("span", "  (" + c.stance + ")", "meta"));
      card.appendChild(box);
    });
    if (r.note) card.appendChild(el("div", r.note, "note"));
    return card;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text.length < 3) return;

    button.disabled = true;
    resultsEl.replaceChildren();
    statusEl.textContent = "Searching... this can take 10-30 seconds.";

    try {
      const res = await fetch("/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();

      if (data.results.length === 0) {
        statusEl.textContent = "No listings matched. Try a higher budget, fewer guests or another neighbourhood.";
      } else {
        statusEl.textContent = data.results.length + " recommendation(s):";
        data.results.forEach(r => resultsEl.appendChild(renderCard(r)));
      }
    } catch (err) {
      statusEl.textContent = "Something went wrong: " + err.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
